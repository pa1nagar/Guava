<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://guava-8wc7.onrender.com" crossorigin>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:,">
  <title data-i18n="sell_page_title">Smart Farmer - Where and when to sell</title>

  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body { background: #FDFBF7; font-family: system-ui, sans-serif; }
    .section-card {
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .form-label {
      display: block;
      font-size: 1rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.25rem;
    }
    .form-input {
      width: 100%;
      min-height: 2.75rem;
      border-radius: 0.75rem;
      border: 1px solid #9CA3AF;
      background: #fff;
      padding: 0 0.75rem;
      font-size: 1rem;
    }
    .btn {
      min-height: 2.75rem;
      min-width: 2.75rem;
      padding: 0 1rem;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 0.9375rem;
      cursor: pointer;
    }
    .btn-primary { background: #1E3A2B; color: #fff; }
    .btn-primary:hover { background: #4A7C59; }
    .btn-secondary { background: #fff; color: #1E3A2B; border: 1px solid #1E3A2B; }
    .btn-secondary:hover { background: #ECFDF5; }
    .btn-danger { background: #fff; color: #B91C1C; border: 1px solid #B91C1C; }
    .btn-danger:hover { background: #FEF2F2; }
    .lang-btn { min-height: 2.75rem; min-width: 2.75rem; padding: 0 0.75rem; border-radius: 0.75rem;
      border: 1px solid rgba(255,255,255,0.6); color: #fff; font-weight: 600; }
    .lang-btn.lang-active { background: #fff; color: #1E3A2B; }
    .badge { display: inline-block; font-size: 0.875rem; font-weight: 700; padding: 0.125rem 0.5rem; border-radius: 9999px; }
    .badge-warn { background: #FEF3C7; color: #78350F; }
    .badge-ok { background: #D1FAE5; color: #064E3B; }
    .badge-old { background: #E5E7EB; color: #1F2937; }
    :focus-visible { outline: 3px solid #E07A5F; outline-offset: 2px; }
    .status-line { font-size: 1rem; color: #374151; }
    .status-line.is-error { color: #B91C1C; font-weight: 600; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body class="min-h-screen bg-brand-bg has-bottom-nav">

  <header class="bg-brand-primary text-white shadow-lg">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div>
        <a href="plan.html" class="inline-flex items-center min-h-[44px] text-green-100 text-sm underline" data-i18n="sell_back">Back to Today</a>
        <h1 class="text-lg font-bold" data-i18n="sell_heading">Where and when to sell</h1>
      </div>
      <div class="flex gap-2" role="group" aria-labelledby="lang-group-label">
        <span id="lang-group-label" class="sr-only" data-i18n="sell_language">Language</span>
        <button type="button" id="lang-en" class="lang-btn" lang="en" data-i18n="sell_lang_en">English</button>
        <button type="button" id="lang-hi" class="lang-btn" lang="hi" data-i18n="sell_lang_hi">हिन्दी</button>
      </div>
    </div>
  </header>

  <div id="demo-banner" class="hidden bg-red-700 text-white text-center font-bold px-4 py-3" role="alert">
    <span data-i18n="sell_demo_banner">DEMO DATA. These prices are made up for testing. Do not use them to decide where to sell.</span>
  </div>

  <main class="max-w-3xl mx-auto px-4 py-6 flex flex-col gap-6">
    <p class="text-sm text-brand-muted" data-i18n="sell_subheading"></p>

    <!-- ===== Costs ===== -->
    <section class="section-card" aria-labelledby="h-settings">
      <h2 id="h-settings" class="font-bold text-emerald-900 text-lg" data-i18n="sell_set_title">Your costs</h2>
      <p class="status-line mt-1" data-i18n="sell_set_intro"></p>
      <p id="settings-status" class="status-line mt-2" role="status" aria-live="polite"></p>
      <button type="button" id="settings-retry" class="btn btn-secondary mt-2 hidden" data-i18n="sell_retry">Try again</button>

      <div id="settings-body" class="hidden mt-3">
        <div id="costs-prompt" class="hidden bg-amber-50 border border-amber-300 rounded-xl px-3 py-2 text-sm text-amber-900 mb-3" data-i18n="sell_set_prompt"></div>
        <p id="location-basis" class="status-line mb-3"></p>

        <div id="sugg-box" class="hidden bg-emerald-50 border border-emerald-200 rounded-xl p-3 mb-3 text-sm">
          <p id="sugg-text"></p>
          <p class="text-brand-muted mt-1" data-i18n="sell_sugg_note"></p>
          <button type="button" id="sugg-apply" class="btn btn-secondary mt-2" data-i18n="sell_sugg_apply"></button>
        </div>

        <form id="settings-form" class="flex flex-col gap-3" novalidate>
          <div>
            <label for="set-mode" class="form-label" data-i18n="sell_set_mode"></label>
            <select id="set-mode" class="form-input">
              <option value="" data-i18n="sell_mode_none"></option>
              <option value="per_quintal_per_km" data-i18n="sell_mode_per_km"></option>
              <option value="flat_per_quintal" data-i18n="sell_mode_flat"></option>
            </select>
          </div>
          <div id="wrap-per-km" class="hidden">
            <label for="set-per-km" class="form-label" data-i18n="sell_set_per_km"></label>
            <input id="set-per-km" type="number" inputmode="decimal" min="0" step="any" class="form-input">
          </div>
          <div id="wrap-flat" class="hidden">
            <label for="set-flat" class="form-label" data-i18n="sell_set_flat"></label>
            <input id="set-flat" type="number" inputmode="decimal" min="0" step="any" class="form-input">
          </div>
          <div>
            <label for="set-handling" class="form-label" data-i18n="sell_set_handling"></label>
            <input id="set-handling" type="number" inputmode="decimal" min="0" step="any" class="form-input">
          </div>
          <div>
            <label for="set-commission" class="form-label" data-i18n="sell_set_commission"></label>
            <input id="set-commission" type="number" inputmode="decimal" min="0" max="100" step="any" class="form-input">
          </div>
          <div>
            <label for="set-radius" class="form-label" data-i18n="sell_set_radius"></label>
            <input id="set-radius" type="number" inputmode="decimal" min="1" step="any" class="form-input" aria-describedby="set-radius-hint">
            <p id="set-radius-hint" class="status-line mt-1"></p>
          </div>
          <p id="settings-form-status" class="status-line" role="status" aria-live="polite"></p>
          <button type="submit" id="settings-save" class="btn btn-primary" data-i18n="sell_set_save">Save costs</button>
        </form>
      </div>
    </section>

    <!-- ===== Ranking ===== -->
    <section class="section-card" aria-labelledby="h-ranking">
      <h2 id="h-ranking" class="font-bold text-emerald-900 text-lg" data-i18n="sell_rank_title">Nearby mandis</h2>
      <p id="ranking-status" class="status-line mt-2" role="status" aria-live="polite"></p>
      <button type="button" id="ranking-retry" class="btn btn-secondary mt-2 hidden" data-i18n="sell_retry">Try again</button>
      <div id="ranking-body" class="hidden mt-3 flex flex-col gap-3"></div>
    </section>

    <!-- ===== Trends ===== -->
    <section class="section-card" aria-labelledby="h-trends">
      <h2 id="h-trends" class="font-bold text-emerald-900 text-lg" data-i18n="sell_trend_title">How prices moved</h2>
      <div class="mt-2">
        <label for="trend-scope" class="form-label" data-i18n="sell_trend_scope_label"></label>
        <select id="trend-scope" class="form-input"></select>
      </div>
      <p id="trends-status" class="status-line mt-2" role="status" aria-live="polite"></p>
      <button type="button" id="trends-retry" class="btn btn-secondary mt-2 hidden" data-i18n="sell_retry">Try again</button>
      <div id="trends-body" class="hidden mt-3 flex flex-col gap-4">
        <div>
          <div class="relative h-56 w-full">
            <canvas id="trend-chart" role="img" aria-describedby="trend-chart-summary" data-aria-i18n="sell_chart_label"></canvas>
          </div>
          <p id="trend-chart-summary" class="status-line mt-1"></p>
        </div>
        <div id="trend-windows" class="grid grid-cols-1 sm:grid-cols-3 gap-3"></div>
        <div id="trend-volatility"></div>
        <div id="trend-confidence"></div>
        <div id="trend-seasonal"></div>
      </div>
    </section>

    <!-- ===== Alerts ===== -->
    <section class="section-card" aria-labelledby="h-alerts">
      <h2 id="h-alerts" class="font-bold text-emerald-900 text-lg" data-i18n="sell_alert_title">Price alerts</h2>
      <p class="status-line mt-1" data-i18n="sell_alert_intro"></p>
      <p id="alerts-status" class="status-line mt-2" role="status" aria-live="polite"></p>
      <button type="button" id="alerts-retry" class="btn btn-secondary mt-2 hidden" data-i18n="sell_retry">Try again</button>
      <div id="alerts-body" class="hidden mt-3 flex flex-col gap-4">
        <form id="alert-form" class="flex flex-col gap-3" novalidate>
          <div>
            <label for="alert-where" class="form-label" data-i18n="sell_alert_where"></label>
            <select id="alert-where" class="form-input" required></select>
          </div>
          <div>
            <label for="alert-target" class="form-label" data-i18n="sell_alert_target"></label>
            <input id="alert-target" type="number" inputmode="decimal" min="0.01" step="any" class="form-input" required>
          </div>
          <div>
            <label for="alert-direction" class="form-label" data-i18n="sell_alert_direction"></label>
            <select id="alert-direction" class="form-input">
              <option value="at_or_above" data-i18n="sell_dir_at_or_above"></option>
              <option value="at_or_below" data-i18n="sell_dir_at_or_below"></option>
            </select>
          </div>
          <p id="alert-form-status" class="status-line" role="status" aria-live="polite"></p>
          <button type="submit" id="alert-add" class="btn btn-primary" data-i18n="sell_alert_add">Add alert</button>
        </form>
        <p id="alerts-limit" class="status-line"></p>
        <ul id="alerts-list" class="flex flex-col gap-2"></ul>
      </div>
    </section>

    <!-- ===== Notifications ===== -->
    <section class="section-card" aria-labelledby="h-notif">
      <h2 id="h-notif" class="font-bold text-emerald-900 text-lg" data-i18n="sell_notif_title">Your notifications</h2>
      <p id="notif-status" class="status-line mt-2" role="status" aria-live="polite"></p>
      <button type="button" id="notif-retry" class="btn btn-secondary mt-2 hidden" data-i18n="sell_retry">Try again</button>
      <ul id="notif-list" class="hidden mt-3 flex flex-col gap-2"></ul>
    </section>

    <!-- ===== Fairness ===== -->
    <section class="section-card" aria-labelledby="h-fair">
      <h2 id="h-fair" class="font-bold text-emerald-900 text-lg" data-i18n="sell_fair_title">Did you get a fair price?</h2>
      <p class="status-line mt-1" data-i18n="sell_fair_intro"></p>
      <p id="fair-status" class="status-line mt-2" role="status" aria-live="polite"></p>
      <button type="button" id="fair-retry" class="btn btn-secondary mt-2 hidden" data-i18n="sell_retry">Try again</button>
      <div id="fair-body" class="hidden mt-3 flex flex-col gap-3"></div>
    </section>
  </main>

  <script type="module" src="js/sell-smart.js"></script>
  <script type="module">import { mountNav } from "./js/nav.js"; mountNav("sell");</script>
  <script type="module" src="js/icons.js"></script>
  <script type="module" src="js/sw-register.js"></script>
</body>
</html>
