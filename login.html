<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://guava-8wc7.onrender.com" crossorigin>
  <meta name="description" content="Sign in to Smart Farmer — your personal farm management platform.">
  <title>Smart Farmer — Login</title>

  <!-- Brand colour config (matches index.html) -->
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-brand-bg flex items-center justify-center px-4">

  <div class="w-full max-w-sm flex flex-col items-center gap-3 text-center">

    <!-- Brand mark -->
    <div class="text-5xl">🌿</div>
    <h1 class="text-2xl font-bold text-brand-primary">Smart Farmer</h1>
    <p class="text-sm text-gray-500">Your personal farm management platform</p>

    <div class="mt-6 w-full flex flex-col gap-3">

      <!-- Sign-in button -->
      <button
        id="btn-google-signin"
        class="w-full min-h-[48px] bg-brand-primary text-white text-base font-semibold
               rounded-lg flex items-center justify-center gap-2
               hover:bg-brand-secondary active:scale-[0.98] transition"
      >
        <!-- Simple "G" mark -->
        <span class="text-lg font-bold">G</span>
        Sign in with Google
      </button>

      <p class="text-xs text-gray-400">Free · No password needed</p>

      <!-- Error display (hidden until needed) -->
      <span
        id="auth-error"
        class="hidden text-red-600 text-sm mt-1"
        role="alert"
      ></span>

    </div>
  </div>

  <script type="module">
    import { routeGuard, signInWithGoogle } from "./js/auth.js";

    document.addEventListener("DOMContentLoaded", async () => {
      // Wake the backend immediately when login page loads.
      // This gives Render ~30 seconds to boot while the farmer reads the page
      // and clicks "Sign in with Google" — so plan.html loads instantly after.
      import("./js/config.js").then(({ API_BASE_URL }) => {
        fetch(`${API_BASE_URL}/health`, { method: "GET" }).catch(() => {});
      });

      await routeGuard("login");
    });

    document.getElementById("btn-google-signin").addEventListener("click", async () => {
      const errEl = document.getElementById("auth-error");
      errEl.classList.add("hidden");
      errEl.textContent = "";
      try {
        await signInWithGoogle();
      } catch (err) {
        errEl.textContent = "Sign-in failed. Please try again.";
        errEl.classList.remove("hidden");
      }
    });
  </script>

  <script type="module" src="js/sw-register.js"></script>
</body>
</html>
