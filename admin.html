<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://guava-8wc7.onrender.com" crossorigin>
  <link rel="icon" href="data:,">
  <title data-i18n="adm_page_title">Smart Farmer - Knowledge admin</title>

  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body { background: #FDFBF7; font-family: system-ui, sans-serif; color: #1F2937; }
    #app { overflow-wrap: anywhere; word-break: break-word; }
    .section-card {
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 1rem;
      padding: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      min-width: 0;
    }
    .form-label { display: block; font-size: 1rem; font-weight: 600; color: #374151; margin-bottom: 0.25rem; }
    .form-input {
      width: 100%; min-height: 2.75rem; border-radius: 0.75rem; border: 1px solid #9CA3AF;
      background: #fff; padding: 0.5rem 0.75rem; font-size: 1rem;
    }
    textarea.form-input { min-height: 6rem; }
    .check-row { display: flex; align-items: center; gap: 0.5rem; min-height: 2.75rem; font-size: 1rem; }
    .check-row input { width: 1.5rem; height: 1.5rem; flex: none; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 2.75rem; min-width: 2.75rem; padding: 0 1rem; border-radius: 0.75rem;
      font-weight: 700; font-size: 1rem; cursor: pointer; text-align: center; text-decoration: none;
    }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #1E3A2B; color: #fff; }
    .btn-primary:hover { background: #4A7C59; }
    .btn-secondary { background: #fff; color: #1E3A2B; border: 1px solid #1E3A2B; }
    .btn-secondary:hover { background: #ECFDF5; }
    .btn-danger { background: #fff; color: #B91C1C; border: 1px solid #B91C1C; }
    .btn-danger:hover { background: #FEF2F2; }
    .tab { background: #fff; color: #1E3A2B; border: 1px solid #1E3A2B; }
    .tab[aria-current="page"] { background: #1E3A2B; color: #fff; }
    .lang-btn { white-space: nowrap; word-break: keep-all; min-height: 2.75rem; min-width: 2.75rem; padding: 0 0.75rem; border-radius: 0.75rem;
      border: 1px solid rgba(255,255,255,0.6); color: #fff; font-weight: 600; }
    .lang-btn.lang-active { background: #fff; color: #1E3A2B; }
    .chip { display: inline-block; font-size: 0.875rem; font-weight: 700; padding: 0.125rem 0.5rem; border-radius: 9999px; background: #E5E7EB; color: #1F2937; }
    .chip-DRAFT { background: #E5E7EB; color: #1F2937; }
    .chip-IN_REVIEW { background: #DBEAFE; color: #1E3A8A; }
    .chip-CHANGES_REQUESTED { background: #FEF3C7; color: #78350F; }
    .chip-APPROVED { background: #D1FAE5; color: #064E3B; }
    .chip-REJECTED { background: #FEE2E2; color: #7F1D1D; }
    .chip-RETIRED { background: #F3F4F6; color: #374151; text-decoration: line-through; }
    .chip-HIGH { background: #FEE2E2; color: #7F1D1D; }
    .chip-MEDIUM { background: #FEF3C7; color: #78350F; }
    .chip-LOW { background: #D1FAE5; color: #064E3B; }
    .chip-warn { background: #FEF3C7; color: #78350F; }
    .banner { background: #FEF3C7; border: 1px solid #F59E0B; color: #78350F; border-radius: 0.75rem; padding: 0.75rem 1rem; font-weight: 600; }
    .notice { border-radius: 0.75rem; padding: 0.75rem 1rem; font-size: 1rem; }
    .notice-ok { background: #ECFDF5; border: 1px solid #10B981; color: #064E3B; }
    .notice-err { background: #FEF2F2; border: 1px solid #DC2626; color: #7F1D1D; }
    .quote { border-left: 4px solid #4A7C59; padding-left: 0.75rem; font-style: italic; color: #374151; }
    .diff-line { font-size: 0.875rem; background: #F9FAFB; border-radius: 0.5rem; padding: 0.25rem 0.5rem; }
    .src-link { display: inline-flex; align-items: center; min-height: 2.75rem; color: #1D4ED8; text-decoration: underline; font-weight: 600; }
    :focus-visible { outline: 3px solid #E07A5F; outline-offset: 2px; }
    .status-line { font-size: 1rem; color: #374151; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .hidden { display: none; }
  </style>
</head>
<body class="min-h-screen bg-brand-bg">
  <!-- Nothing but this status is in the page until the server confirms the role. -->
  <main id="app" class="max-w-3xl mx-auto px-4 py-6 flex flex-col gap-4">
    <p id="boot-status" class="status-line" role="status" aria-live="polite" data-i18n="adm_checking">Checking access...</p>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
