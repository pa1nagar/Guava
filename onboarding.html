<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://guava-8wc7.onrender.com" crossorigin>
  <meta name="robots" content="noindex, nofollow">
  <title>Smart Farmer — Tell us about your farm</title>

  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-brand-bg">

  <div id="lang-bar" class="lang-bar">
    <span class="lang-bar__label">🌐 <span data-i18n="home.lang.label">Language</span>:</span>
    <button type="button" id="lang-en" class="lang-pill lang-active" lang="en">English</button>
    <button type="button" id="lang-hi" class="lang-pill" lang="hi">हिन्दी</button>
  </div>
  <div class="sf-banner"><picture><source type="image/webp" srcset="images/farmer-480.webp 480w, images/farmer-960.webp 960w" sizes="100vw"><img src="images/farmer-480.jpg" width="480" height="360" alt="" data-i18n-alt="img.farmer.alt" decoding="async"></picture></div>

  <header class="bg-brand-primary px-4 py-3">
    <h1 class="text-white text-lg font-semibold" data-i18n="onb.title">🌿 Tell us about your farm</h1>
  </header>

  <main class="px-4 pt-4 pb-8 max-w-lg mx-auto">
    <p id="page-status" class="hidden text-base text-gray-700 mb-3" role="status"></p>
    <form id="onboarding-form" autocomplete="off" novalidate class="flex flex-col gap-4">

      <!-- Crop -->
      <div class="flex flex-col gap-1">
        <label for="crop" class="text-base font-medium text-gray-700"><span data-i18n="onb.crop">Crop</span> <span class="text-red-700" aria-hidden="true">*</span></label>
        <select id="crop" name="crop" required class="h-12 rounded-lg border border-gray-400 bg-white px-3 text-base focus:outline-none focus:border-brand-secondary">
          <option value="guava" data-i18n="onb.crop.guava">Guava</option>
        </select>
      </div>

      <!-- Number of plants -->
      <div class="flex flex-col gap-1">
        <label for="plant-count" class="text-base font-medium text-gray-700"><span data-i18n="onb.plantCount">Number of plants</span> <span class="text-red-700" aria-hidden="true">*</span></label>
        <input
          type="number"
          inputmode="numeric"
          id="plant-count"
          name="plant_count"
          min="1"
          step="1"
          required
          aria-describedby="plant-count-error"
          data-i18n-placeholder="onb.plantCount.placeholder"
          placeholder="e.g. 500"
          class="h-12 rounded-lg border border-gray-400 bg-white px-3 text-base focus:outline-none focus:border-brand-secondary"
        >
        <span id="plant-count-error" class="hidden text-red-700 text-base" role="alert"></span>
      </div>

      <!-- State -->
      <div class="flex flex-col gap-1">
        <label for="state-select" class="text-base font-medium text-gray-700"><span data-i18n="onb.state">State</span> <span class="text-red-700" aria-hidden="true">*</span></label>
        <select id="state-select" name="state" required class="h-12 rounded-lg border border-gray-400 bg-white px-3 text-base focus:outline-none focus:border-brand-secondary">
          <option value="" data-i18n="onb.state.placeholder">Select state</option>
        </select>
      </div>

      <!-- District -->
      <div class="flex flex-col gap-1">
        <label for="district-select" class="text-base font-medium text-gray-700"><span data-i18n="onb.district">District</span> <span class="text-red-700" aria-hidden="true">*</span></label>
        <select id="district-select" name="district" required disabled
                class="h-12 rounded-lg border border-gray-400 bg-white px-3 text-base disabled:bg-gray-100 disabled:text-gray-600 focus:outline-none focus:border-brand-secondary">
          <option value="" data-i18n="onb.district.placeholder">Select district</option>
        </select>
      </div>

      <!-- Date planted -->
      <div class="flex flex-col gap-1">
        <label for="sowing-date" class="text-base font-medium text-gray-700"><span data-i18n="onb.date">When did you plant the trees?</span> <span class="text-red-700" aria-hidden="true">*</span></label>
        <input
          type="date"
          id="sowing-date"
          name="sowing_date"
          required
          aria-describedby="sowing-date-error"
          class="h-12 rounded-lg border border-gray-400 bg-white px-3 text-base focus:outline-none focus:border-brand-secondary"
        >
        <span id="sowing-date-error" class="hidden text-red-700 text-base" role="alert"></span>
      </div>

      <!-- Expected yield (optional) -->
      <div class="flex flex-col gap-1">
        <label for="expected-yield" class="text-base font-medium text-gray-700">
          <span data-i18n="onb.yield">Expected harvest</span>
          <span class="text-gray-600 font-normal" data-i18n="onb.optional">(optional)</span>
        </label>
        <div class="relative">
          <input
            type="number"
            inputmode="decimal"
            id="expected-yield"
            name="expected_yield_kg"
            min="1"
            step="any"
            aria-describedby="yield-hint yield-error"
            data-i18n-placeholder="onb.yield.placeholder"
            placeholder="e.g. 50000"
            class="h-12 w-full rounded-lg border border-gray-400 bg-white px-3 pr-14 text-base focus:outline-none focus:border-brand-secondary"
          >
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-base text-gray-600" data-i18n="onb.yield.unit">kg</span>
        </div>
        <p id="yield-hint" class="text-base text-gray-600" data-i18n="onb.yield.hint">Used later to calculate your break-even price. You can skip this now.</p>
        <span id="yield-error" class="hidden text-red-700 text-base" role="alert"></span>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        id="btn-submit"
        class="w-full min-h-[48px] bg-brand-primary text-white text-base font-semibold
               rounded-lg hover:bg-brand-secondary active:scale-[0.98] transition mt-1 disabled:opacity-60"
        data-i18n="onb.submit"
      >Get my plan</button>

      <!-- API / network error -->
      <div id="form-error" class="hidden text-red-700 text-base text-center font-semibold" role="alert"></div>

      <!-- Loading state -->
      <div id="form-loading" class="hidden text-gray-700 text-base text-center" role="status" data-i18n="onb.loading">
        Getting your plan…
      </div>

    </form>
  </main>

  <script type="module" src="js/onboarding.js"></script>

  <script type="module" src="js/icons.js"></script>
  <script type="module" src="js/sw-register.js"></script>
</body>
</html>
